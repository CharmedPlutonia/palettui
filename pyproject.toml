[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palettui"
version = "0.1.0"
description = "Terminal palette studio and TUI color guide"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CharmedPlutonia" }]
keywords = ["tui", "terminal", "palette", "ansi", "theme", "color"]
classifiers = [
    "Environment :: Console",
    "Topic :: Terminals",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
palettui = "palettui.app:run"

[tool.setuptools.packages.find]
include = ["palettui*"]
